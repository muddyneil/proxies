[project]
name = "free-proxy-airport"
version = "0.1.0"
description = "Free Clash/Mihomo proxy subscription generator with real latency benchmarking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["ruff==0.16.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["generator"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
# Pin the enabled rule set explicitly. ruff's default select has widened
# across versions (newer ruff enables BLE/S preview rules by default), so an
# explicit select keeps `ruff check` stable and matches the historically
# enforced default set (E4/E7/E9/F).
select = ["E4", "E7", "E9", "F"]

